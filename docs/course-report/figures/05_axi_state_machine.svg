<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1460" viewBox="0 0 2200 1460" role="img" aria-label="AXI4 single-transaction master state machine">
  <title>AXI4 single-transaction master state machine</title>
  <desc>Engineering state diagram aligned to axi_master.v</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; }
      .mono { font-family: "Cascadia Mono", Consolas, monospace; }
    </style>
  </defs>
  <rect width="2200" height="1460" fill="#ffffff"/>
  <text x="48" y="58" font-size="44" font-weight="800" fill="#111827">AXI4 single-transaction master state machine (no cache)</text>
<text x="48" y="96" font-size="26" fill="#475569">RTL: axi_master.v  |  request priority: data write &gt; data read &gt; instruction read</text>
<line x1="48" y1="120" x2="2152" y2="120" stroke="#111827" stroke-width="3"/>
<rect x="740" y="190" width="720" height="235" fill="#ffffff" stroke="#111827" stroke-width="3"/>
<rect x="740" y="190" width="720" height="60" fill="#e5e7eb" stroke="#111827" stroke-width="3"/>
<rect x="740" y="190" width="8" height="235" fill="#374151"/>
<text x="760" y="230" font-size="31" font-weight="800" fill="#111827">IDLE</text>
<text x="1440" y="230" text-anchor="end" font-size="25" fill="#334155" class="mono">ST_IDLE = 3'd0</text>
<text x="762" y="290" font-size="25" fill="#111827" class="mono">dc_dev_wrdy = 1</text>
<text x="762" y="328" font-size="25" fill="#111827" class="mono">dc_dev_rrdy = !|dc_cpu_wen</text>
<text x="762" y="366" font-size="25" fill="#111827" class="mono">ic_dev_rrdy = !|dc_cpu_wen &amp;&amp; !dc_cpu_ren</text>
<rect x="110" y="570" width="500" height="205" fill="#ffffff" stroke="#111827" stroke-width="3"/>
<rect x="110" y="570" width="500" height="60" fill="#e5e7eb" stroke="#111827" stroke-width="3"/>
<rect x="110" y="570" width="8" height="205" fill="#1d4ed8"/>
<text x="130" y="610" font-size="31" font-weight="800" fill="#111827">RADDR</text>
<text x="590" y="610" text-anchor="end" font-size="25" fill="#334155" class="mono">3'd1</text>
<text x="132" y="670" font-size="25" fill="#111827" class="mono">ARVALID = 1</text>
<text x="132" y="708" font-size="25" fill="#111827" class="mono">ARADDR = aligned address</text>
<rect x="110" y="980" width="500" height="205" fill="#ffffff" stroke="#111827" stroke-width="3"/>
<rect x="110" y="980" width="500" height="60" fill="#e5e7eb" stroke="#111827" stroke-width="3"/>
<rect x="110" y="980" width="8" height="205" fill="#1d4ed8"/>
<text x="130" y="1020" font-size="31" font-weight="800" fill="#111827">RDATA</text>
<text x="590" y="1020" text-anchor="end" font-size="25" fill="#334155" class="mono">3'd2</text>
<text x="132" y="1080" font-size="25" fill="#111827" class="mono">RREADY = 1</text>
<text x="132" y="1118" font-size="25" fill="#111827" class="mono">capture RDATA</text>
<rect x="1590" y="570" width="500" height="245" fill="#ffffff" stroke="#111827" stroke-width="3"/>
<rect x="1590" y="570" width="500" height="60" fill="#e5e7eb" stroke="#111827" stroke-width="3"/>
<rect x="1590" y="570" width="8" height="245" fill="#b45309"/>
<text x="1610" y="610" font-size="31" font-weight="800" fill="#111827">WSEND</text>
<text x="2070" y="610" text-anchor="end" font-size="25" fill="#334155" class="mono">3'd3</text>
<text x="1612" y="670" font-size="25" fill="#111827" class="mono">AWVALID until AWREADY</text>
<text x="1612" y="708" font-size="25" fill="#111827" class="mono">WVALID until WREADY</text>
<text x="1612" y="746" font-size="25" fill="#111827" class="mono">WSTRB = dc_cpu_wen</text>
<rect x="1590" y="980" width="500" height="205" fill="#ffffff" stroke="#111827" stroke-width="3"/>
<rect x="1590" y="980" width="500" height="60" fill="#e5e7eb" stroke="#111827" stroke-width="3"/>
<rect x="1590" y="980" width="8" height="205" fill="#b45309"/>
<text x="1610" y="1020" font-size="31" font-weight="800" fill="#111827">WRESP</text>
<text x="2070" y="1020" text-anchor="end" font-size="25" fill="#334155" class="mono">3'd4</text>
<text x="1612" y="1080" font-size="25" fill="#111827" class="mono">BREADY = 1</text>
<text x="1612" y="1118" font-size="25" fill="#111827" class="mono">wait for BVALID</text>
<circle cx="1100" cy="150" r="14" fill="#111827"/>
<path d="M 1100 164 L 1100 190" fill="none" stroke="#111827" stroke-width="4"  marker-end="url(#arrowInk)"/>
<text x="1130" y="176" font-size="27" font-weight="700" fill="#111827">reset</text>
<path d="M 740 310 L 630 310 L 630 672 L 610 672" fill="none" stroke="#1d4ed8" stroke-width="5"  marker-end="url(#arrowBlue)"/>
<text x="646" y="520" font-size="29" font-weight="800" fill="#1d4ed8">R1</text>
<path d="M 360 775 L 360 980" fill="none" stroke="#1d4ed8" stroke-width="5"  marker-end="url(#arrowBlue)"/>
<text x="382" y="895" font-size="29" font-weight="800" fill="#1d4ed8">R2</text>
<path d="M 110 1082 L 55 1082 L 55 310 L 740 310" fill="none" stroke="#1d4ed8" stroke-width="5"  marker-end="url(#arrowBlue)"/>
<text x="76" y="930" font-size="29" font-weight="800" fill="#1d4ed8">R3</text>
<path d="M 1460 310 L 1570 310 L 1570 692 L 1590 692" fill="none" stroke="#b45309" stroke-width="5"  marker-end="url(#arrowOrange)"/>
<text x="1528" y="520" font-size="29" font-weight="800" fill="#b45309">W1</text>
<path d="M 1840 815 L 1840 980" fill="none" stroke="#b45309" stroke-width="5"  marker-end="url(#arrowOrange)"/>
<text x="1862" y="910" font-size="29" font-weight="800" fill="#b45309">W2</text>
<path d="M 2090 1082 L 2145 1082 L 2145 310 L 1460 310" fill="none" stroke="#b45309" stroke-width="5"  marker-end="url(#arrowOrange)"/>
<text x="2088" y="930" font-size="29" font-weight="800" fill="#b45309">W3</text>
<path d="M 2090 660 C 2165 660 2165 760 2030 790" fill="none" stroke="#b45309" stroke-width="5" marker-end="url(#arrowOrange)"/>
<text x="1745" y="545" font-size="27" font-weight="800" fill="#b45309">W0: wait / backpressure</text>
<rect x="700" y="545" width="800" height="690" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<rect x="700" y="545" width="800" height="62" fill="#e5e7eb" stroke="#64748b" stroke-width="2"/>
<text x="728" y="587" font-size="32" font-weight="800" fill="#111827">Transition conditions</text>
<text x="735" y="660" font-size="28" font-weight="800" fill="#1d4ed8" class="mono">R1</text>
<text x="825" y="660" font-size="27" fill="#111827" class="mono">dc_cpu_ren &amp;&amp; dc_dev_rrdy</text>
<text x="735" y="724" font-size="28" font-weight="800" fill="#1d4ed8" class="mono"></text>
<text x="825" y="724" font-size="27" fill="#111827" class="mono">or ic_cpu_ren &amp;&amp; ic_dev_rrdy</text>
<text x="735" y="788" font-size="28" font-weight="800" fill="#1d4ed8" class="mono">R2</text>
<text x="825" y="788" font-size="27" fill="#111827" class="mono">ARVALID &amp;&amp; ARREADY</text>
<text x="735" y="852" font-size="28" font-weight="800" fill="#1d4ed8" class="mono">R3</text>
<text x="825" y="852" font-size="27" fill="#111827" class="mono">RVALID &amp;&amp; RREADY</text>
<text x="735" y="916" font-size="28" font-weight="800" fill="#b45309" class="mono">W1</text>
<text x="825" y="916" font-size="27" fill="#111827" class="mono">|dc_cpu_wen| &amp;&amp; dc_dev_wrdy</text>
<text x="735" y="980" font-size="28" font-weight="800" fill="#b45309" class="mono">W2</text>
<text x="825" y="980" font-size="27" fill="#111827" class="mono">AW done &amp;&amp; W done</text>
<text x="735" y="1044" font-size="28" font-weight="800" fill="#b45309" class="mono">W3</text>
<text x="825" y="1044" font-size="27" fill="#111827" class="mono">BVALID &amp;&amp; BREADY</text>
<text x="735" y="1108" font-size="28" font-weight="800" fill="#b45309" class="mono">W0</text>
<text x="825" y="1108" font-size="27" fill="#111827" class="mono">otherwise remain in WSEND</text>
<line x1="735" y1="1180" x2="1465" y2="1180" stroke="#cbd5e1" stroke-width="2"/>
<text x="735" y="1215" font-size="24" fill="#475569">AW and W may handshake independently; both must complete before WRESP.</text>
<rect x="110" y="1270" width="1980" height="105" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="142" y="1312" font-size="27" fill="#111827">32-bit, single beat, INCR, 4-byte aligned. CPU response signals are one-cycle pulses.</text>
<text x="142" y="1352" font-size="27" fill="#b91c1c">No cache is implemented: describe this path as direct AXI access, not a cache miss.</text>
<line x1="48" y1="1410" x2="2152" y2="1410" stroke="#111827" stroke-width="2"/>
<text x="48" y="1446" font-size="27" fill="#111827">Blue: read states  |  Brown: write states  |  R1-R3/W0-W3 map arrows to the condition table.</text>
</svg>