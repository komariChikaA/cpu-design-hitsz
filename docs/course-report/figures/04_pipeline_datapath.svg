<rect x="90" y="790" width="8" height="235" fill="#1d4ed8"/>
<text x="112" y="828" font-size="30" font-weight="800" fill="#111827">AXI Master</text>
<text x="110" y="876" font-size="24" fill="#475569">direct AXI access (no cache)</text>
<text x="110" y="914" font-size="25" fill="#111827" class="mono">AR/R: instruction + data read</text>
<text x="110" y="952" font-size="25" fill="#111827" class="mono">AW/W/B: data write</text>
</g>
<g>
<rect x="825" y="790" width="600" height="235" fill="#ffffff" stroke="#111827" stroke-width="3"/>
