<text x="120" y="1145" font-size="31" font-weight="800" fill="#111827">Pipeline-register payloads</text>
<text x="120" y="1200" font-size="29" font-weight="800" fill="#111827">IF/ID</text>
<text x="120" y="1242" font-size="25" fill="#334155" class="mono">id_pc, id_inst</text>
<text x="120" y="1282" font-size="25" fill="#334155" class="mono">id_valid</text>
<text x="665" y="1200" font-size="29" font-weight="800" fill="#111827">ID/EX</text>
<text x="665" y="1242" font-size="25" fill="#334155" class="mono">ex_pc, ext, rs1/rs2/rd</text>
<text x="665" y="1282" font-size="25" fill="#334155" class="mono">control, ex_valid</text>
<text x="1210" y="1200" font-size="29" font-weight="800" fill="#111827">EX/MEM</text>
<text x="1210" y="1242" font-size="25" fill="#334155" class="mono">mem_alu_c, store data, rd</text>
<text x="1210" y="1282" font-size="25" fill="#334155" class="mono">control, mem_valid</text>
<text x="1755" y="1200" font-size="29" font-weight="800" fill="#111827">MEM/WB</text>
<text x="1755" y="1242" font-size="25" fill="#334155" class="mono">wb_alu_c, ram_ext, rd</text>
<text x="1755" y="1282" font-size="25" fill="#334155" class="mono">control, wb_valid</text>
