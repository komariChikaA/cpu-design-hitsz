<text x="70" y="323" font-size="30" font-weight="800" fill="#111827">IF</text>
<text x="68" y="371" font-size="24" fill="#475569">PC / next-PC</text>
<text x="68" y="409" font-size="25" fill="#111827" class="mono">ifetch_req, ifetch_addr</text>
<text x="68" y="447" font-size="25" fill="#111827" class="mono">ifetch_inst, ifetch_valid</text>
</g>
<g>
