<rect x="825" y="790" width="8" height="235" fill="#6d28d9"/>
<text x="847" y="828" font-size="30" font-weight="800" fill="#111827">Forward Unit</text>
<text x="845" y="876" font-size="24" fill="#475569">EX/MEM and MEM/WB bypass</text>
<text x="845" y="914" font-size="25" fill="#111827" class="mono">MEM hit -&gt; select 01</text>
<text x="845" y="952" font-size="25" fill="#111827" class="mono">WB hit -&gt; select 10</text>
</g>
<g>
