<text x="1620" y="876" font-size="24" fill="#475569">stall / bubble / flush / resume</text>
<text x="1620" y="914" font-size="25" fill="#111827" class="mono">load_use_hazard, duplicate</text>
<text x="1620" y="952" font-size="25" fill="#111827" class="mono">memory_freeze, ex_bj_f</text>
</g>
